# Minimal project-local Codex profile for unattended Polyphony workers.
# Polyphony exposes the bounded GitHub tool directly; project MCP servers are
# intentionally not inherited into workers because their schemas and outputs
# are replayed into every turn.
approval_policy = "never"
sandbox_mode = "workspace-write"
# Unattended workers should spend tokens on the requested slice, not open-ended
# planning. Escalation/review profiles can opt into a stronger setting later.
model_reasoning_effort = "low"
include_apps_instructions = false
include_permissions_instructions = false
include_environment_context = false
include_collaboration_mode_instructions = false

[features]
apps = false
enable_mcp_apps = false

[mcp_servers]
