[tools]
erlang = "28"
elixir = "1.19.5-otp-28"

[tasks.webhook]
description = "Start local Polyphony server in foreground (Ctrl+C to stop)"
run = "cd elixir && set -a && [ -f ../.env ] && . ../.env && [ -f ./.env ] && . ./.env && set +a && export GITHUB_TOKEN=${GITHUB_TOKEN:-$GITHUB_PROJECTS_PAT} && echo \"[webhook] env loaded\" && echo \"[webhook] WEBHOOK_PORT=${WEBHOOK_PORT:-4000}\" && echo \"[webhook] GITHUB_REPO=${GITHUB_REPO_OWNER:-?}/${GITHUB_REPO_NAME:-?}\" && echo \"[webhook] PROJECT=${GITHUB_PROJECT_OWNER_LOGIN:-?}/${GITHUB_PROJECT_NUMBER:-?}\" && echo \"[webhook] starting foreground server\" && exec mix run --no-halt"

[tasks.webhook-fg]
description = "Start local Polyphony server in foreground (Ctrl+C to stop)"
run = "mise run webhook"

[tasks.webhook-bg]
description = "Start local Polyphony server in background and write logs to /tmp/polyphony-webhook.log"
run = "echo 'Deprecated. Use `mise run webhook` in foreground.' && exit 1"

[tasks.webhook-logs]
description = "Tail local Polyphony webhook logs"
run = "cd elixir && tail -f log/symphony.log.1"

[tasks.webhook-status]
description = "Show webhook process and port status"
run = "port=${WEBHOOK_PORT:-4000}; echo \"[webhook-status] port=${port}\"; lsof -iTCP:${port} -sTCP:LISTEN -n -P || true; pgrep -af \"mix run --no-halt|beam.smp\" || true"

[tasks.webhook-stop]
description = "Stop local Polyphony webhook server by freeing WEBHOOK_PORT (default 4000)"
run = "port=${WEBHOOK_PORT:-4000}; pids=$(lsof -tiTCP:${port} -sTCP:LISTEN 2>/dev/null || true); if [ -n \"$pids\" ]; then echo \"[webhook-stop] killing pids on ${port}: $pids\"; kill $pids || true; else echo \"[webhook-stop] nothing listening on ${port}\"; fi"

[tasks.funnel]
description = "Expose local webhook server to the public internet via Tailscale Funnel"
run = "set -a; . ./.env; set +a; tailscale funnel --https=443 http://127.0.0.1:${WEBHOOK_PORT:-4000}"

[tasks.funnel-stop]
description = "Disable Tailscale Funnel on HTTPS 443"
run = "tailscale funnel --https=443 off"

[tasks.oauth-start]
description = "Open GitHub OAuth authorization start URL for local Polyphony"
run = "set -a; . ./.env; set +a; url=${GITHUB_OAUTH_START_URL:-http://127.0.0.1:4000/auth/github/start}; (command -v xdg-open >/dev/null 2>&1 && xdg-open \"$url\") || (command -v open >/dev/null 2>&1 && open \"$url\") || echo \"$url\""

[tasks.webhook-auth]
description = "Start Polyphony webhook server and open GitHub OAuth auth page"
run = "echo 'Run `mise run webhook`, then open /auth/github/start in your browser.' && exit 1"
